[project]
name = "listingarena-data"
version = "0.2.0"
description = "ListingArena collectors, normalization, cross-source merge, change tracking, Postgres loader, publisher"
requires-python = ">=3.12,<3.13"
dependencies = ["requests>=2.31", "psycopg[binary]>=3.2"]

[project.scripts]
la-collect = "jobs.collect:main"
la-migrate = "db.migrate:main"
la-load = "jobs.load_run:main"
la-publish = "publish.app:main"

[dependency-groups]
dev = ["pgserver>=0.1.4", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sources", "normalization", "matching", "jobs", "db", "publish", "states"]
